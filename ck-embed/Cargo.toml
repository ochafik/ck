[package]
name = "ck-embed"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Text embedding providers for ck semantic search"
repository = "https://github.com/BeaconBay/ck"
keywords = ["embedding", "nlp", "semantic"]
categories = ["science"]

[dependencies]
ck-core = { workspace = true }
ck-models = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

fastembed = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
num_cpus = { workspace = true, optional = true }

# Static embeddings support (model2vec-style, distinct from the mixedbread ONNX path above)
safetensors = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

[features]
default = ["fastembed", "mixedbread", "static-embeddings"]
fastembed = ["dep:fastembed"]
mixedbread = [
    "dep:hf-hub",
    "dep:tokenizers",
    "dep:ort",
    "dep:once_cell",
    "dep:ndarray",
    "dep:num_cpus",
]
# static-embeddings only needs tokenizers (shared with mixedbread) plus its own deps
static-embeddings = [
    "dep:tokenizers",
    "dep:safetensors",
    "dep:bytemuck",
    "dep:reqwest",
    "dep:futures-util",
    "dep:indicatif",
]
