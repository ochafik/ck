[package]
name = "ck-embed"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Text embedding providers for ck semantic search"
repository = "https://github.com/BeaconBay/ck"
keywords = ["embedding", "nlp", "semantic"]
categories = ["science"]

[dependencies]
ck-core = { version = "0.7.1", path = "../ck-core" }

anyhow = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

fastembed = { workspace = true, optional = true }

# Static embeddings support
tokenizers = { workspace = true }
safetensors = { workspace = true }
bytemuck = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
indicatif = { workspace = true }

[features]
default = ["fastembed", "static-embeddings"]
fastembed = ["dep:fastembed"]
static-embeddings = []